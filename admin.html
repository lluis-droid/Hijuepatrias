<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANEL DEL INVESTIGADOR — hijuepatrias</title>
    <link rel="stylesheet" href="stylescaso1.css">
</head>
<body>
    <div class="vignette"></div>
    <div class="noise"></div>

    <div class="notebook">
        <div class="tape"></div>
        <div class="watermark">HIJUEPATRIAS</div>
        <div class="stamp">confidencial</div>

        <div class="logo-bar">
            <img src="logo.png" alt="">
            <span>hijuepatrias · inteligencia &amp; estrategia</span>
        </div>

        <div class="case-header">
            <h1>Panel del Investigador</h1>
            <div class="case-number">— Modo Administrador —</div>
        </div>

        <div class="notebook-content" id="adminContent">
            <p class="admin-subtitle" id="adminStatus"></p>
            <a href="expedientecaso1.html" class="admin-back" id="adminBackLink">← Volver al expediente</a>
            <a href="Index.html" class="admin-back" style="margin-left:14px;">↰ Salir del panel</a>

            <div id="adminCaseSelect" class="admin-case-select">
                <div class="admin-case-btn" onclick="selectCase(1)">
                    <h2>Caso 1</h2>
                    <p>El Archivo 17 — Campus Digital</p>
                </div>
                <div class="admin-case-btn" onclick="selectCase(2)">
                    <h2>Caso 2</h2>
                    <p>La Línea de Agua — Unidad Centinela</p>
                </div>
            </div>

            <div id="adminPanel" class="admin-hidden"></div>
        </div>

        <div class="footer-note">— hijuepatrias · Panel del Investigador —</div>
    </div>

    <script src="admin_data.js"></script>
    <script>
        if (localStorage.getItem('admin_access') !== 'true') {
            window.location.href = 'expedientecaso1.html';
        }

        document.getElementById('adminStatus').textContent = 'MODO ADMINISTRADOR ACTIVADO — Código 1120';

        function selectCase(num) {
            var key = 'caso' + num;
            var data = ADMIN_DATA[key];
            if (!data) return;

            document.getElementById('adminCaseSelect').classList.add('admin-hidden');
            document.getElementById('adminBackLink').setAttribute('href', 'expedientecaso' + num + '.html');
            var panel = document.getElementById('adminPanel');
            panel.classList.remove('admin-hidden');
            panel.innerHTML = renderCase(key, data, num);
            panel.scrollIntoView({ behavior: 'smooth' });
        }

        function backToCases() {
            document.getElementById('adminCaseSelect').classList.remove('admin-hidden');
            var panel = document.getElementById('adminPanel');
            panel.classList.add('admin-hidden');
            panel.innerHTML = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleSection(btn) {
            btn.parentElement.classList.toggle('open');
        }

        function adminAccordion(title, body, open) {
            var cls = open ? ' admin-acc open' : ' admin-acc';
            return '<div class="' + cls + '">' +
                '<button class="admin-acc-head" onclick="toggleSection(this)">' +
                '<span>' + title + '</span><span class="admin-acc-arrow">▾</span>' +
                '</button><div class="admin-acc-body">' + body + '</div></div>';
        }

        function renderCase(key, data, num) {
            var sol = data.solution;
            var sName = sol.responsible;

            var html = '<div class="admin-section">';
            html += '<a href="#" class="admin-back" onclick="backToCases();return false;">← Seleccionar otro caso</a>';
            html += '<h3>CASO ' + num + ' — ' + (num === 1 ? 'El Archivo 17' : 'La Línea de Agua') + '</h3>';
            html += '<div class="admin-answer">RESPONSABLE: <strong>' + sName + '</strong></div></div>';

            html += renderSection1(sol, sName);
            html += renderSection2(data.suspects);
            html += renderSection3(data.evidences);
            html += renderSection4(data.connections);
            html += renderSection5(sol.timeline);
            html += renderSection6(data.false_theories);
            html += renderSection7(data.step_by_step);
            html += renderSection8(data.game_answers, data.suspects);
            html += renderSection9(key, num);
            html += renderSection10(data);

            return html;
        }

        function renderSection1(sol, sName) {
            var body = '<div class="admin-card">';
            body += '<span class="admin-label">RESPONSABLE</span>';
            body += '<div class="admin-value" style="font-size:1.1rem;color:#8b2020;font-weight:bold;">' + sName + '</div>';
            body += '<span class="admin-label">MOTIVO</span>';
            body += '<div class="admin-value">' + sol.motive + '</div>';
            body += '<span class="admin-label">MÉTODO</span>';
            body += '<div class="admin-value">' + sol.method + '</div>';
            body += '<span class="admin-label">OBJETIVO</span>';
            body += '<div class="admin-value">' + sol.objective + '</div>';
            body += '</div>';
            return adminAccordion('1. Solución completa', body, true);
        }

        function renderSection2(suspects) {
            var body = '';
            suspects.forEach(function(s) {
                var guiltyText = s.culpable ? 'SÍ — Responsable del caso' : 'NO — Pieza del misterio';
                var guiltyColor = s.culpable ? 'color:#8b2020;font-weight:bold;' : 'color:#006400;';
                body += '<div class="admin-card">';
                body += '<div class="admin-row"><div>';
                body += '<h4>' + s.nombre + '</h4>';
                body += '<span class="admin-label" style="' + guiltyColor + '">¿Es culpable? ' + guiltyText + '</span>';
                body += '<span class="admin-label">Qué estaba ocultando</span>';
                body += '<div class="admin-value">' + s.ocultando + '</div>';
                body += '</div><div>';
                body += '<span class="admin-label">Por qué parecía culpable</span>';
                body += '<div class="admin-value">' + s.parece_culpable + '</div>';
                body += '<span class="admin-label">Por qué finalmente se descarta</span>';
                body += '<div class="admin-value">' + s.se_descarta + '</div>';
                body += '<span class="admin-label">Relación con el caso</span>';
                body += '<div class="admin-value">' + s.papel_real + '</div>';
                body += '</div></div></div>';
            });
            return adminAccordion('2. Cada sospechoso', body, false);
        }

        function renderSection3(evidences) {
            var body = '';
            evidences.forEach(function(ev) {
                body += '<div class="admin-card">';
                body += '<h4>Evidencia ' + ev.id + ' (clave: ' + ev.keyword + ')</h4>';
                body += '<div class="admin-grid"><div>';
                body += '<span class="admin-label">Qué contiene realmente</span>';
                body += '<div class="admin-value">' + ev.contiene + '</div>';
                body += '<span class="admin-label">Qué debería notar el jugador</span>';
                body += '<div class="admin-value">' + ev.notar + '</div>';
                body += '<span class="admin-label">Con qué otras evidencias se conecta</span>';
                body += '<div class="admin-value">' + ev.conecta_con.map(function(e) { return 'Evidencia ' + e; }).join(', ') + '</div>';
                body += '<span class="admin-label">Qué sospechoso afecta</span>';
                body += '<div class="admin-value">' + ev.afecta.join(', ') + '</div>';
                body += '</div><div>';
                body += '<span class="admin-label">Qué hipótesis permite crear</span>';
                body += '<div class="admin-value">' + ev.permite_hipotesis + '</div>';
                body += '<span class="admin-label">Qué hipótesis permite descartar</span>';
                body += '<div class="admin-value">' + ev.descarta_hipotesis + '</div>';
                body += '<span class="admin-label">Cuál es la deducción correcta</span>';
                body += '<div class="admin-value" style="color:#8b2020;">' + ev.deduccion + '</div>';
                body += '</div></div></div>';
            });
            return adminAccordion('3. Cada evidencia', body, false);
        }

        function renderSection4(connections) {
            var body = '<p class="admin-subtitle">Sospechosos ↔ Evidencias ↔ Fechas ↔ Lugares ↔ Objetos ↔ Acontecimientos</p>';
            body += '<div class="admin-map">' + connections.join('\n') + '</div>';
            return adminAccordion('4. Mapa de conexiones', body, false);
        }

        function renderSection5(timeline) {
            var body = '';
            timeline.forEach(function(t) {
                var tagClass = t.type === 'direct' ? 'admin-tag-direct' : 'admin-tag-deduce';
                var tagText = t.type === 'direct' ? 'DIRECTO' : 'DEDUCIR';
                var evText = t.evidence ? 'Ev ' + t.evidence : '';
                body += '<div class="admin-timeline-entry">';
                body += '<div class="admin-timeline-time">' + t.time + '</div>';
                body += '<div>';
                body += '<div class="admin-timeline-desc">' + t.event + '</div>';
                body += '<div><span class="admin-timeline-tag ' + tagClass + '">' + tagText + '</span>';
                if (evText) body += ' <span class="admin-timeline-tag" style="border-color:#8b7a5a;color:#8b7a5a;">' + evText + '</span>';
                body += ' <span style="font-size:0.65rem;color:#8b7a5a;">— ' + t.involved + '</span>';
                body += '</div></div></div>';
            });
            return adminAccordion('5. Cronología real', body, false);
        }

        function renderSection6(theories) {
            var body = '';
            theories.forEach(function(t) {
                body += '<div class="admin-card">';
                body += '<h4>' + t.teoria + '</h4>';
                body += '<span class="admin-label">Por qué parece correcta</span>';
                body += '<div class="admin-value">' + t.parece_correcta + '</div>';
                body += '<span class="admin-label">Qué evidencia la contradice</span>';
                body += '<div class="admin-value">' + t.contradice + '</div>';
                body += '<span class="admin-label">Cómo puede descubrirse que es falsa</span>';
                body += '<div class="admin-value">' + t.descubrir + '</div>';
                body += '</div>';
            });
            return adminAccordion('6. Teorías falsas', body, false);
        }

        function renderSection7(steps) {
            var body = '<div class="step-list">';
            steps.forEach(function(s) {
                body += '<div class="step-item">' + s + '</div>';
            });
            body += '</div>';
            return adminAccordion('7. Ruta lógica de resolución', body, false);
        }

        function renderSection8(answers, suspects) {
            var respName = '';
            var descName = '';
            suspects.forEach(function(s) {
                if (s.id === answers.responsible) respName = s.nombre;
                if (s.id === answers.descartadoKey) descName = s.nombre;
            });
            var body = '<div class="admin-card"><div class="admin-grid"><div>';
            body += '<span class="admin-label">Responsable</span>';
            body += '<div class="admin-value admin-correct">' + respName + ' (ID: ' + answers.responsible + ')</div>';
            body += '<span class="admin-label">Motivo (opción correcta)</span>';
            body += '<div class="admin-value admin-correct">' + answers.motiveKey + '</div>';
            body += '<span class="admin-label">Método (opción correcta)</span>';
            body += '<div class="admin-value admin-correct">' + answers.methodKey + '</div>';
            body += '</div><div>';
            body += '<span class="admin-label">Evidencias decisivas</span>';
            body += '<div class="admin-value admin-correct">' + answers.evidences.join(', ') + '</div>';
            body += '<span class="admin-label">Sospechoso a descartar</span>';
            body += '<div class="admin-value admin-correct">' + descName + ' (ID: ' + answers.descartadoKey + ')</div>';
            body += '</div></div></div>';
            return adminAccordion('8. Respuestas del juego', body, false);
        }

        function renderSection9(key, num) {
            var body = '<div class="admin-controls">';
            body += '<button class="admin-ctrl-btn" onclick="resetCase(' + num + ')">Reiniciar progreso Caso ' + num + '</button>';
            body += '<button class="admin-ctrl-btn" onclick="unlockAll(' + num + ')">Desbloquear todas las evidencias</button>';
            body += '<button class="admin-ctrl-btn danger" onclick="lockAll(' + num + ')">Bloquear todas las evidencias</button>';
            body += '</div>';
            body += '<div id="adminCtrlMsg" style="font-size:0.7rem;color:#8b7a5a;margin-top:8px;"></div>';
            return adminAccordion('9. Control de caso', body, true);
        }

        function renderSection10(data) {
            var body = '<div class="admin-card"><div class="admin-grid"><div>';
            body += '<span class="admin-label">Total sospechosos</span>';
            body += '<div class="admin-value">' + data.suspects.length + '</div>';
            body += '<span class="admin-label">Total evidencias</span>';
            body += '<div class="admin-value">' + data.evidences.length + '</div>';
            body += '<span class="admin-label">Responsable</span>';
            body += '<div class="admin-value">' + data.solution.responsible + '</div>';
            body += '</div><div>';
            body += '<span class="admin-label">Teorías falsas documentadas</span>';
            body += '<div class="admin-value">' + data.false_theories.length + '</div>';
            body += '<span class="admin-label">Pasos en ruta lógica</span>';
            body += '<div class="admin-value">' + data.step_by_step.length + '</div>';
            body += '<span class="admin-label">Conexiones en mapa</span>';
            body += '<div class="admin-value">' + data.connections.length + ' líneas</div>';
            body += '</div></div></div>';
            return adminAccordion('10. Estado interno del caso', body, false);
        }

        function resetCase(num) {
            var prefix = 'caso' + num + '_ev_';
            var keys = Object.keys(localStorage);
            keys.forEach(function(k) {
                if (k.indexOf(prefix) === 0) localStorage.removeItem(k);
            });
            document.getElementById('adminCtrlMsg').textContent = 'Progreso del Caso ' + num + ' reiniciado.';
        }

        function unlockAll(num) {
            var total = num === 1 ? 6 : 6;
            for (var i = 1; i <= total; i++) {
                localStorage.setItem('caso' + num + '_ev_' + i, 'true');
            }
            document.getElementById('adminCtrlMsg').textContent = 'Todas las evidencias del Caso ' + num + ' desbloqueadas.';
        }

        function lockAll(num) {
            var total = num === 1 ? 6 : 6;
            for (var i = 1; i <= total; i++) {
                localStorage.removeItem('caso' + num + '_ev_' + i);
            }
            document.getElementById('adminCtrlMsg').textContent = 'Todas las evidencias del Caso ' + num + ' bloqueadas.';
        }
    </script>
</body>
</html>
