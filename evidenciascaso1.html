<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidencias — Campus Digital</title>
    <link rel="stylesheet" href="stylescaso1.css">
</head>
<body>
    <div class="vignette"></div>
    <div class="noise"></div>

    <div class="notebook">
        <div class="tape"></div>
        <div class="watermark">HIJUEPATRIAS</div>
        <div class="stamp">confidencial</div>

        <div class="logo-bar">
            <img src="logo.png" alt="">
            <span>hijuepatrias · inteligencia &amp; estrategia</span>
        </div>

        <div class="case-header">
            <h1>Evidencias del Caso</h1>
            <div class="case-number">— Campus Digital —</div>
        </div>

        <a href="expedientecaso1.html" class="back-link">← Volver al expediente</a>

        <div class="evidence-progress" id="evidenceProgress" role="status" aria-live="polite">
            <div class="evidence-progress-track"><div class="evidence-progress-fill" id="progressFill"></div></div>
            <span class="evidence-progress-text" id="progressText">0 de 6 evidencias desbloqueadas</span>
        </div>

        <div class="notebook-content">
            <div class="evidence-grid" id="evidenceGrid"></div>
        </div>

        <div class="footer-note">— hijuepatrias · Evidencia clasificada —</div>
    </div>

    <script src="datacaso1.js"></script>
    <script src="scriptcaso1.js"></script>
    <script>
        (function() {
            var grid = document.getElementById('evidenceGrid');
            var total = CASO1.evidences.length;
            var unlockedCount = 0;
            CASO1.evidences.forEach(function(ev) {
                var unlocked = isUnlocked(ev.id);
                if (unlocked) unlockedCount++;
                var card = document.createElement('a');
                card.className = 'evidence-card' + (unlocked ? ' unlocked' : ' locked');
                card.href = 'evidencia' + ev.id + 'caso1.html';
                card.innerHTML =
                    '<span class="status-icon"><svg viewBox="0 0 24 24">' + (unlocked ? '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a2 2 0 0 1 3.75-.94"/><line x1="17.5" y1="8.5" x2="20" y2="6"/><line x1="20" y1="6" x2="22.5" y2="8.5"/>' : '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>') + '</svg></span>' +
                    '<h3>EVIDENCIA ' + ev.id + '</h3>' +
                    '<span class="status-label' + (unlocked ? ' unlocked-label' : ' locked-label') + '">' + (unlocked ? 'Acceso concedido' : 'Sellada') + '</span>';
                grid.appendChild(card);
            });
            var fill = document.getElementById('progressFill');
            var text = document.getElementById('progressText');
            var pct = Math.round((unlockedCount / total) * 100);
            fill.style.width = pct + '%';
            if (unlockedCount === total) {
                text.textContent = 'Investigación completa: las 6 evidencias están desbloqueadas.';
                document.getElementById('evidenceProgress').classList.add('complete');
            } else {
                text.textContent = unlockedCount + ' de ' + total + ' evidencias desbloqueadas';
            }
        })();
    </script>
</body>
</html>
